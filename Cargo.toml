[package]
name = "keerp"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-rp = { version = "0.10", features = ["rp2040", "rt", "critical-section-impl", "time-driver"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
panic-halt = "1.0"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0" }
embassy-futures = "0.1.2"
usbd-hid = "0.10.2"
embedded-io-async = "0.7.0"
embassy-sync = "0.8.0"
heapless = "0.9.3"

[profile.dev]
opt-level = 1

[profile.release]
debug = 2
opt-level = "s"
